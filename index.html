const headers = {
  "Content-Type": "application/json",

};

async function sbSelect(table, params = "") {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers });
  return res.json();
}
async function sbUpsert(table, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: "POST",
    headers: { ...headers, "Prefer": "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify(body),
  });
  return res.json();
}
async function sbDelete(table, params) {
  await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { method: "DELETE", headers });
}

// Mobile detection hook
function useIsMobile() {
  const [isMobile, setIsMobile] = React.useState(window.innerWidth <= 480);
  React.useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth <= 480);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);
  return isMobile;
}

function nextAvailState(current) {
  if (!current) return "available";
  if (current === "available") return "unavailable";
  return null;
}
function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function getFirstDay(y, m) { return new Date(y, m, 1).getDay(); }

// ── Profile Setup / Login ─────────────────────────────────────────
function ProfileSetup({ project, onComplete, onBack }) {
  const isMobile = useIsMobile();
  const [name, setName] = useState("");
  const [instrument, setInstrument] = useState("");
  const [step, setStep] = useState("name"); // "name" | "new"
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  const lookupOrCreate = async () => {
    if (!name.trim()) { setError("Enter your name"); return; }
    setSaving(true);
    setError("");
    try {
      // Look up by name (case-insensitive)
      const rows = await sbSelect("members", `select=*&name=ilike.${encodeURIComponent(name.trim())}`);
      if (rows && rows.length > 0) {
        // Found — log straight in
        onComplete(rows[0]);
      } else {
        // New person — ask for instrument
        setStep("new");
      }
    } catch {
      setError("Could not connect — check your connection");
    }
    setSaving(false);
  };

  const createMember = async () => {
    setSaving(true);
    try {
      const result = await sbUpsert("members", { name: name.trim(), instrument: instrument.trim() });
      const saved = Array.isArray(result) ? result[0] : result;
      onComplete(saved);
    } catch {
      setError("Could not save — try again");
    }
    setSaving(false);
  };

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ background: "rgba(15,15,15,0.92)", border: `1px solid ${project.color || "#333"}`, borderRadius: 12, padding: 36, width: "100%", maxWidth: 380 }}>
        <button onClick={step === "new" ? () => setStep("name") : onBack} style={{ background: "none", border: "none", color: "#555", cursor: "pointer", fontFamily: "'Courier New', monospace", fontSize: 11, letterSpacing: 2, marginBottom: 24, padding: 0 }}>← BACK</button>
        <div style={{ textAlign: "center", marginBottom: 32 }}>
          <div style={{ fontSize: 11, letterSpacing: 4, color: project.color || "#666", textTransform: "uppercase", marginBottom: 8 }}>{project.name}</div>
          <div style={{ fontSize: 32, fontWeight: 900, color: "#fff", lineHeight: 1 }}>
            {step === "name" ? "WHO ARE YOU?" : "NEW MEMBER"}
          </div>
          {step === "name" && <div style={{ fontSize: 11, color: "#444", marginTop: 8, letterSpacing: 1 }}>Enter your name to sign in</div>}
          {step === "new" && <div style={{ fontSize: 11, color: "#444", marginTop: 8, letterSpacing: 1 }}>Welcome, {name.trim()}! What do you play?</div>}
        </div>

        {step === "name" && (
          <>
            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 10, color: "#555", letterSpacing: 2, marginBottom: 6, textTransform: "uppercase" }}>Your Name</div>

            {error && <div style={{ color: "#FF6B6B", fontSize: 11, marginBottom: 12 }}>{error}</div>}
            <button onClick={lookupOrCreate} disabled={saving}
              style={{ width: "100%", background: project.color || "#4ECDC4", color: "#000", border: "none", borderRadius: 8, padding: "14px", fontFamily: "'Courier New', monospace", fontSize: 15, fontWeight: 900, cursor: "pointer", letterSpacing: 2, opacity: saving ? 0.6 : 1 }}>
              {saving ? "LOOKING UP..." : "LET'S JAM →"}
            </button>

        )}

        {step === "new" && (
          <>

              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>

}

// ── Calendar ──────────────────────────────────────────────────────
function BandCalendar({ project, currentMember, onBack }) {
  const today = new Date();
  const isMobile = useIsMobile();
  const [month, setMonth] = useState(today.getMonth());
  const [year, setYear] = useState(today.getFullYear());
  const [members, setMembers] = useState([]);
  const [activeMemberId, setActiveMemberId] = useState(currentMember.id);
  const [availability, setAvailability] = useState({});
  const [hoveredDay, setHoveredDay] = useState(null);
  const [events, setEvents] = useState({});
  const [showEventModal, setShowEventModal] = useState(false);
  const [selectedDay, setSelectedDay] = useState(null);
  const [newEvent, setNewEvent] = useState({ title: "", type: "gig", time: "", notes: "" });
  const [viewingDay, setViewingDay] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [status, setStatus] = useState("");

  const getKey = (day) => `${year}-${month}-${day}`;

  const loadData = async () => {
    setLoading(true);
    try {
      const [memberRows, avRows, evRows] = await Promise.all([
        sbSelect("members", "select=*&order=created_at.asc"),
        sbSelect("availability", `select=day_key,member_index,available&project_id=eq.${project.id}`),
        sbSelect("events", `select=*&project_id=eq.${project.id}&order=created_at.asc`),
      ]);
      setMembers(memberRows || []);
      const avMap = {};
      for (const row of (avRows || [])) {
        if (!avMap[row.day_key]) avMap[row.day_key] = {};
        avMap[row.day_key][row.member_index] = row.available;
      }
      setAvailability(avMap);
      const evMap = {};
      for (const row of (evRows || [])) {
        if (!evMap[row.day_key]) evMap[row.day_key] = [];
        evMap[row.day_key].push(row);
      }
      setEvents(evMap);
    } catch (e) {
      setStatus("⚠️ Could not connect to database");
    }
    setLoading(false);
  };

  useEffect(() => { loadData(); }, []);

  const showStatus = (msg) => { setStatus(msg); setTimeout(() => setStatus(""), 2500); };

  const toggleDay = async (day, e) => {
    e.stopPropagation();
    const key = getKey(day);
    const current = (availability[key] || {})[activeMemberId] || null;
    const newVal = nextAvailState(current);
    setAvailability(prev => ({ ...prev, [key]: { ...(prev[key] || {}), [activeMemberId]: newVal } }));
    setSaving(true);
    try {
      if (newVal === null) {
        await sbDelete("availability", `day_key=eq.${key}&member_index=eq.${activeMemberId}&project_id=eq.${project.id}`);
        showStatus("✓ Cleared");
      } else {
        await sbUpsert("availability", { day_key: key, member_index: activeMemberId, available: newVal, project_id: project.id });
        showStatus(newVal === "available" ? "✓ Available" : "✓ Not available");
      }
    } catch {
      showStatus("⚠️ Save failed");
      setAvailability(prev => ({ ...prev, [key]: { ...(prev[key] || {}), [activeMemberId]: current } }));
    }
    setSaving(false);
  };

  const addEvent = async () => {
    if (!newEvent.title.trim()) return;
    const key = getKey(selectedDay);
    setSaving(true);
    try {
      const result = await sbUpsert("events", { day_key: key, title: newEvent.title.trim(), type: newEvent.type, time: newEvent.time, notes: newEvent.notes, project_id: project.id });
      const saved = Array.isArray(result) ? result[0] : result;
      setEvents(prev => ({ ...prev, [key]: [...(prev[key] || []), saved] }));
      setNewEvent({ title: "", type: "gig", time: "", notes: "" });
      setShowEventModal(false);
      setViewingDay(selectedDay);
      showStatus("✓ Event added");
    } catch { showStatus("⚠️ Could not save event"); }
    setSaving(false);
  };

  const deleteEvent = async (day, eventId) => {
    const key = getKey(day);
    setEvents(prev => ({ ...prev, [key]: (prev[key] || []).filter(e => e.id !== eventId) }));
    try { await sbDelete("events", `id=eq.${eventId}`); showStatus("✓ Deleted"); }
    catch { showStatus("⚠️ Delete failed"); loadData(); }
  };

  const daysInMonth = getDaysInMonth(year, month);
  const firstDay = getFirstDay(year, month);
  const prevMonth = () => { if (month === 0) { setMonth(11); setYear(y => y - 1); } else setMonth(m => m - 1); };
  const nextMonth = () => { if (month === 11) { setMonth(0); setYear(y => y + 1); } else setMonth(m => m + 1); };
  const isToday = (day) => day === today.getDate() && month === today.getMonth() && year === today.getFullYear();

  const getActiveState = (day) => (availability[getKey(day)] || {})[activeMemberId] || null;
  const getAvailCount = (day) => Object.values(availability[getKey(day)] || {}).filter(v => v === "available").length;
  const getUnavailCount = (day) => Object.values(availability[getKey(day)] || {}).filter(v => v === "unavailable").length;
  const getAvailMembers = (day) => members.filter(m => (availability[getKey(day)] || {})[m.id] === "available");
  const getUnavailMembers = (day) => members.filter(m => (availability[getKey(day)] || {})[m.id] === "unavailable");
  const getDayEvents = (day) => events[getKey(day)] || [];
  const getTypeInfo = (id) => EVENT_TYPES.find(t => t.id === id) || EVENT_TYPES[4];

  const getDayStyle = (day) => {
    const state = getActiveState(day);
    if (state === "available") return { background: "#1a7a1a", border: "2px solid #4CAF50", numberColor: "#fff" };
    if (state === "unavailable") return { background: "rgba(60,10,10,0.9)", border: "2px solid #FF4444", numberColor: "#FF6666" };
    return { background: "rgba(26,26,26,0.8)", border: isToday(day) ? "2px solid #fff" : "2px solid rgba(60,60,60,0.8)", numberColor: "#ccc" };
  };

  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const upcomingEvents = Object.entries(events)
    .flatMap(([key, evts]) => evts.map(e => ({ ...e, key })))
    .filter(e => { const [y, m, d] = e.key.split("-").map(Number); return new Date(y, m, d) >= new Date(today.getFullYear(), today.getMonth(), today.getDate()); })
    .sort((a, b) => { const [ay,am,ad] = a.key.split("-").map(Number); const [by,bm,bd] = b.key.split("-").map(Number); return new Date(ay,am,ad) - new Date(by,bm,bd); })
    .slice(0, 5);

  return (
    <div style={{ minHeight: "100vh", fontFamily: "'Courier New', monospace", color: "#f0f0f0", padding: isMobile ? "16px 10px" : "24px 20px", maxWidth: 700, margin: "0 auto" }}>
      <div style={{ textAlign: "center", marginBottom: 24 }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: "#555", cursor: "pointer", fontFamily: "'Courier New', monospace", fontSize: 11, letterSpacing: 2, marginBottom: 8, display: "block", margin: "0 auto 8px" }}>← ALL PROJECTS</button>
        <div style={{ fontSize: 11, letterSpacing: 6, color: project.color || "#aaa", textTransform: "uppercase", marginBottom: 4 }}>Band Scheduler</div>
        <div style={{ fontSize: isMobile ? 22 : 32, fontWeight: 900, letterSpacing: -1, color: "#fff", lineHeight: 1, textShadow: "0 2px 10px rgba(0,0,0,0.8)" }}>{project.name.toUpperCase()} CALENDAR</div>
        <div style={{ marginTop: 8, fontSize: 11, color: saving ? "#FFD93D" : status.startsWith("⚠️") ? "#FF6B6B" : "#4ECDC4", letterSpacing: 1, minHeight: 16 }}>
          {saving ? "SAVING..." : status}
        </div>
      </div>

      {loading ? (
        <div style={{ textAlign: "center", color: "#aaa", fontSize: 13, padding: 40 }}>Connecting to database...</div>
      ) : (
        <div>
          <div style={{ marginBottom: 20 }}>
            <div style={{ fontSize: 10, letterSpacing: 4, color: "#aaa", marginBottom: 8, textTransform: "uppercase" }}>Band Members</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {members.map((m, i) => {
                const color = COLORS[i % COLORS.length];
                const isActive = activeMemberId === m.id;
                const isMe = m.id === currentMember.id;
                return (
                  <button key={m.id} onClick={() => setActiveMemberId(m.id)} className="member-btn"
                    style={{ background: isActive ? color.bg : "rgba(30,30,30,0.85)", color: isActive ? "#000" : color.bg, border: `2px solid ${color.bg}`, borderRadius: 4, padding: isMobile ? "6px 10px" : "6px 14px", fontFamily: "'Courier New', monospace", fontSize: isMobile ? 12 : 13, fontWeight: 700, cursor: "pointer", letterSpacing: 1 }}>
                    {m.name}{isMe ? " ★" : ""}
                  </button>
                );
              })}
            </div>
            <div style={{ fontSize: 10, color: "#555", marginTop: 6 }}>
              You are: <span style={{ color: project.color || "#4ECDC4", fontWeight: 700 }}>{currentMember.name}</span>
              {currentMember.instrument && <span style={{ color: "#666" }}> · {currentMember.instrument}</span>}
              <span onClick={onBack} style={{ color: "#444", marginLeft: 12, cursor: "pointer", textDecoration: "underline" }}>switch project</span>
            </div>
          </div>

          <div style={{ display: "flex", gap: 16, marginBottom: 16, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 10, color: "#aaa", letterSpacing: 1 }}>
              <div style={{ width: 12, height: 12, borderRadius: 3, background: "#1a7a1a", border: "1px solid #4CAF50" }} /> AVAILABLE
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 10, color: "#aaa", letterSpacing: 1 }}>
              <div style={{ width: 12, height: 12, borderRadius: 3, background: "rgba(60,10,10,0.9)", border: "1px solid #FF4444" }} /> NOT AVAILABLE
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 10, color: "#aaa", letterSpacing: 1 }}>
              <div style={{ width: 12, height: 12, borderRadius: 3, background: "rgba(26,26,26,0.8)", border: "1px solid rgba(60,60,60,0.8)" }} /> NO INPUT
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
            <button onClick={prevMonth} style={navBtn}>←</button>
            <div style={{ fontSize: isMobile ? 15 : 18, fontWeight: 700, letterSpacing: isMobile ? 1 : 2, color: "#fff", textShadow: "0 2px 8px rgba(0,0,0,0.8)" }}>{MONTHS[month]} {year}</div>
            <button onClick={nextMonth} style={navBtn}>→</button>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 4 }}>
            {DAYS.map(d => <div key={d} style={{ textAlign: "center", fontSize: 10, color: "#aaa", letterSpacing: 2, padding: "4px 0", textTransform: "uppercase" }}>{d}</div>)}
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
            {cells.map((day, idx) => {
              if (!day) return <div key={`e-${idx}`} />;
              const dayStyle = getDayStyle(day);
              const activeState = getActiveState(day);
              const avMembers = getAvailMembers(day);
              const unavailMembers = getUnavailMembers(day);
              const hovered = hoveredDay === day;
              const dayEvts = getDayEvents(day);
              const count = getAvailCount(day);
              return (
                <div key={day} style={{ position: "relative" }}
                  onMouseEnter={() => setHoveredDay(day)} onMouseLeave={() => setHoveredDay(null)}
                  onContextMenu={e => { e.preventDefault(); setSelectedDay(day); setShowEventModal(true); setViewingDay(null); }}>
                  <div onClick={e => isMobile ? (setViewingDay(day)) : toggleDay(day, e)}
                    style={{ aspectRatio: "1", borderRadius: 8, background: dayStyle.background, border: dayStyle.border, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", position: "relative", overflow: "hidden" }}>
                    <div style={{ fontSize: isMobile ? 11 : 13, fontWeight: 700, color: dayStyle.numberColor, lineHeight: 1 }}>{day}</div>
                    {activeState === "unavailable" && <div style={{ fontSize: 9, color: "#FF4444", fontWeight: 900, marginTop: 1, lineHeight: 1 }}>✕</div>}
                    {dayEvts.length > 0 && <div style={{ display: "flex", gap: 2, marginTop: 2, flexWrap: "wrap", justifyContent: "center" }}>{dayEvts.slice(0,3).map((e,i) => <div key={i} style={{ width: 5, height: 5, borderRadius: 1, background: getTypeInfo(e.type).color, opacity: 0.9 }} />)}</div>}
                    {members.some(m => (availability[getKey(day)] || {})[m.id]) && (
                      <div style={{ marginTop: 3, display: "flex", gap: 2, flexWrap: "wrap", justifyContent: "center", padding: "0 2px" }}>
                        {members.map((m, i) => {
                          const state = (availability[getKey(day)] || {})[m.id];
                          if (!state) return null;
                          const isAvail = state === "available";
                          return (
                            <div key={m.id} style={{ background: isAvail ? "#1a7a1a" : "rgba(60,10,10,0.9)", border: `1px solid ${isAvail ? "#4CAF50" : "#FF4444"}`, borderRadius: 3, padding: "1px 3px", fontSize: 8, fontWeight: 900, color: isAvail ? "#4CAF50" : "#FF4444", lineHeight: 1.4, letterSpacing: 0 }}>
                              {m.name.slice(0,2).toUpperCase()}
                            </div>
                          );
                        })}
                      </div>
                    )}
                    {!isMobile && hovered && <button onClick={e => { e.stopPropagation(); setSelectedDay(day); setShowEventModal(true); setViewingDay(null); }} style={{ position: "absolute", top: 2, right: 2, background: "rgba(255,255,255,0.15)", border: "none", color: "#fff", borderRadius: 3, width: 14, height: 14, cursor: "pointer", fontSize: 10, display: "flex", alignItems: "center", justifyContent: "center", padding: 0, fontWeight: 900 }}>+</button>}
                  </div>
                  {!isMobile && hovered && (avMembers.length > 0 || unavailMembers.length > 0 || dayEvts.length > 0) && (
                    <div style={{ position: "absolute", bottom: "110%", left: "50%", transform: "translateX(-50%)", background: "rgba(20,20,20,0.95)", border: "1px solid #444", borderRadius: 6, padding: "8px 10px", fontSize: 11, color: "#fff", whiteSpace: "nowrap", zIndex: 20, pointerEvents: "none", minWidth: 120 }}>
                      {dayEvts.length > 0 && <div style={{ marginBottom: (avMembers.length > 0 || unavailMembers.length > 0) ? 6 : 0 }}>{dayEvts.map((e,i) => <div key={i} style={{ color: getTypeInfo(e.type).color, fontWeight: 700 }}>{getTypeInfo(e.type).label.split(" ")[0]} {e.title}{e.time ? ` · ${e.time}` : ""}</div>)}</div>}
                      {avMembers.length > 0 && <div><div style={{ fontWeight: 700, color: "#4CAF50", letterSpacing: 1, fontSize: 10, marginBottom: 2 }}>FREE ({avMembers.length})</div>{avMembers.map((m,i) => <div key={i} style={{ color: COLORS[members.indexOf(m) % COLORS.length].bg }}>{m.name}{m.instrument ? ` · ${m.instrument}` : ""}</div>)}</div>}
                      {unavailMembers.length > 0 && <div style={{ marginTop: avMembers.length > 0 ? 4 : 0 }}><div style={{ fontWeight: 700, color: "#FF4444", letterSpacing: 1, fontSize: 10, marginBottom: 2 }}>BUSY ({unavailMembers.length})</div>{unavailMembers.map((m,i) => <div key={i} style={{ color: "#FF6666" }}>{m.name}</div>)}</div>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {upcomingEvents.length > 0 && (
            <div style={{ marginTop: 20, padding: 16, background: "rgba(26,26,26,0.85)", borderRadius: 8, border: "1px solid rgba(60,60,60,0.8)" }}>
              <div style={{ fontSize: 10, letterSpacing: 3, color: "#aaa", marginBottom: 10, textTransform: "uppercase" }}>Upcoming Events</div>
              {upcomingEvents.map((e, i) => {
                const [y, m, d] = e.key.split("-").map(Number);
                const typeInfo = getTypeInfo(e.type);
                return (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8, padding: "6px 10px", background: "rgba(34,34,34,0.9)", borderRadius: 6, borderLeft: `3px solid ${typeInfo.color}` }}>
                    <div style={{ fontSize: 16 }}>{typeInfo.label.split(" ")[0]}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: "#fff" }}>{e.title}</div>
                      <div style={{ fontSize: 10, color: "#888" }}>{MONTHS[m].slice(0,3)} {d}, {y}{e.time ? ` · ${e.time}` : ""}</div>
                    </div>
                    <div style={{ fontSize: 10, color: typeInfo.color, fontWeight: 700, textTransform: "uppercase" }}>{e.type}</div>
                  </div>
                );
              })}
            </div>
          )}

          <div style={{ marginTop: 16, padding: 16, background: "rgba(26,26,26,0.85)", borderRadius: 8, border: "1px solid rgba(60,60,60,0.8)" }}>
            <div style={{ fontSize: 10, letterSpacing: 3, color: "#aaa", marginBottom: 10, textTransform: "uppercase" }}>This month — who's free</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: isMobile ? 6 : 8 }}>
              {members.map((m, i) => {
                const freeCount = Array.from({ length: daysInMonth }, (_, d) => d + 1).filter(d => (availability[getKey(d)] || {})[m.id] === "available").length;
                const busyCount = Array.from({ length: daysInMonth }, (_, d) => d + 1).filter(d => (availability[getKey(d)] || {})[m.id] === "unavailable").length;
                const isMe = m.id === currentMember.id;
                return (
                  <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 6, background: isMe ? "rgba(50,50,30,0.9)" : "rgba(34,34,34,0.9)", borderRadius: 4, padding: "4px 10px", border: isMe ? `1px solid ${project.color || "#666"}` : "1px solid transparent" }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: COLORS[i % COLORS.length].bg }} />
                    <span style={{ fontSize: 12, color: "#ccc" }}>{m.name}{isMe ? " ★" : ""}</span>
                    {m.instrument && <span style={{ fontSize: 10, color: "#555" }}>{m.instrument}</span>}
                    <span style={{ fontSize: 12, color: "#4CAF50", fontWeight: 700 }}>{freeCount}✓</span>
                    {busyCount > 0 && <span style={{ fontSize: 12, color: "#FF6666", fontWeight: 700 }}>{busyCount}✕</span>}
                  </div>
                );
              })}
            </div>
          </div>

          <div style={{ display: "flex", gap: 8, marginTop: 16, justifyContent: "center" }}>
            <button onClick={loadData} style={{ ...navBtn, fontSize: 11, letterSpacing: 1 }}>↺ REFRESH</button>
          </div>
          <div style={{ textAlign: "center", marginTop: 12, fontSize: 10, color: "#aaa", letterSpacing: 1 }}>
            {isMobile ? "TAP DAY = VIEW & TOGGLE · SYNCED VIA SUPABASE" : "CLICK DAY = CYCLE (FREE → BUSY → CLEAR) · RIGHT-CLICK = ADD EVENT · SYNCED VIA SUPABASE"}
          </div>
        </div>
      )}

      {showEventModal && selectedDay && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={() => setShowEventModal(false)}>
          <div style={{ background: "#1a1a1a", border: "1px solid #333", borderRadius: 10, padding: 24, width: "100%", maxWidth: 360 }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: 11, letterSpacing: 4, color: "#555", marginBottom: 4, textTransform: "uppercase" }}>Add Event</div>
            <div style={{ fontSize: 20, fontWeight: 900, color: "#fff", marginBottom: 20 }}>{MONTHS[month]} {selectedDay}, {year}</div>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 10, color: "#555", letterSpacing: 2, marginBottom: 6, textTransform: "uppercase" }}>Type</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {EVENT_TYPES.map(t => <button key={t.id} onClick={() => setNewEvent(p => ({ ...p, type: t.id }))} style={{ background: newEvent.type === t.id ? t.color : "#222", color: newEvent.type === t.id ? "#000" : t.color, border: `1px solid ${t.color}`, borderRadius: 4, padding: "4px 10px", fontFamily: "'Courier New', monospace", fontSize: 11, cursor: "pointer", fontWeight: 700 }}>{t.label}</button>)}
              </div>
            </div>
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 10, color: "#555", letterSpacing: 2, marginBottom: 6, textTransform: "uppercase" }}>Title *</div>
              <input value={newEvent.title} onChange={e => setNewEvent(p => ({ ...p, title: e.target.value }))} placeholder="e.g. The Garage, Studio B..." style={inputStyle} />
            </div>
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 10, color: "#555", letterSpacing: 2, marginBottom: 6, textTransform: "uppercase" }}>Time (optional)</div>
              <input value={newEvent.time} onChange={e => setNewEvent(p => ({ ...p, time: e.target.value }))} placeholder="e.g. 8:00 PM" style={inputStyle} />
            </div>
            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 10, color: "#555", letterSpacing: 2, marginBottom: 6, textTransform: "uppercase" }}>Notes (optional)</div>
              <textarea value={newEvent.notes} onChange={e => setNewEvent(p => ({ ...p, notes: e.target.value }))} placeholder="Address, load-in time, pay..." rows={2} style={{ ...inputStyle, resize: "vertical" }} />
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={addEvent} disabled={saving} style={{ flex: 1, background: getTypeInfo(newEvent.type).color, color: "#000", border: "none", borderRadius: 6, padding: "10px", fontFamily: "'Courier New', monospace", fontSize: 13, fontWeight: 900, cursor: "pointer", opacity: saving ? 0.6 : 1 }}>
                {saving ? "SAVING..." : "ADD EVENT"}
              </button>
              <button onClick={() => setShowEventModal(false)} style={{ background: "#222", color: "#666", border: "1px solid #333", borderRadius: 6, padding: "10px 16px", fontFamily: "'Courier New', monospace", fontSize: 13, cursor: "pointer" }}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {viewingDay && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={() => setViewingDay(null)}>
          <div style={{ background: "#1a1a1a", border: "1px solid #333", borderRadius: 10, padding: 24, width: "100%", maxWidth: 360 }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: 20, fontWeight: 900, color: "#fff", marginBottom: 4 }}>{MONTHS[month]} {viewingDay}</div>
            <div style={{ fontSize: 10, color: "#555", letterSpacing: 2, marginBottom: 16 }}>{getAvailCount(viewingDay)} AVAILABLE · {getUnavailCount(viewingDay)} BUSY</div>
            {getDayEvents(viewingDay).length > 0 ? (
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 10, color: "#555", letterSpacing: 2, marginBottom: 8, textTransform: "uppercase" }}>Events</div>
                {getDayEvents(viewingDay).map(e => {
                  const typeInfo = getTypeInfo(e.type);
                  return (
                    <div key={e.id} style={{ background: "#222", borderRadius: 6, padding: "10px 12px", marginBottom: 8, borderLeft: `3px solid ${typeInfo.color}` }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                        <div>
                          <div style={{ fontSize: 13, fontWeight: 700, color: "#fff" }}>{typeInfo.label.split(" ")[0]} {e.title}</div>
                          {e.time && <div style={{ fontSize: 11, color: "#666", marginTop: 2 }}>{e.time}</div>}
                          {e.notes && <div style={{ fontSize: 11, color: "#888", marginTop: 4 }}>{e.notes}</div>}
                        </div>
                        <button onClick={() => deleteEvent(viewingDay, e.id)} style={{ background: "none", border: "none", color: "#444", cursor: "pointer", fontSize: 16, padding: "0 0 0 8px" }}>×</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : <div style={{ color: "#444", fontSize: 12, marginBottom: 16 }}>No events this day.</div>}
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 10, color: "#555", letterSpacing: 2, marginBottom: 8, textTransform: "uppercase" }}>Availability</div>
              {members.map((m, i) => {
                const state = (availability[getKey(viewingDay)] || {})[m.id] || null;
                const isAvail = state === "available";
                const isUnavail = state === "unavailable";
                return (
                  <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: isAvail ? "#4CAF50" : isUnavail ? "#FF4444" : "#333" }} />
                    <span style={{ fontSize: 12, color: isAvail ? "#fff" : isUnavail ? "#FF6666" : "#444" }}>{m.name}</span>
                    {m.instrument && <span style={{ fontSize: 10, color: "#555" }}>{m.instrument}</span>}
                    <span style={{ fontSize: 10, color: isAvail ? "#4CAF50" : isUnavail ? "#FF4444" : "#333", marginLeft: "auto" }}>{isAvail ? "FREE" : isUnavail ? "BUSY" : "—"}</span>
                  </div>
                );
              })}
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {isMobile && (() => { const st = (availability[getKey(viewingDay)] || {})[activeMemberId] || null; const next = nextAvailState(st); return <button onClick={e => { toggleDay(viewingDay, e); setViewingDay(null); }} style={{ flex: 1, background: next === "available" ? "#1a7a1a" : next === "unavailable" ? "rgba(60,10,10,0.9)" : "#222", color: next === "available" ? "#4CAF50" : next === "unavailable" ? "#FF4444" : "#666", border: next === "available" ? "1px solid #4CAF50" : next === "unavailable" ? "1px solid #FF4444" : "1px solid #333", borderRadius: 6, padding: "10px", fontFamily: "'Courier New', monospace", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>{next === "available" ? "✓ Mark Free" : next === "unavailable" ? "✕ Mark Busy" : "○ Clear"}</button>; })()}
              <button onClick={() => { setSelectedDay(viewingDay); setShowEventModal(true); setViewingDay(null); }} style={{ flex: 1, background: "#222", color: "#aaa", border: "1px solid #333", borderRadius: 6, padding: "10px", fontFamily: "'Courier New', monospace", fontSize: 12, cursor: "pointer" }}>+ Add Event</button>
              <button onClick={() => setViewingDay(null)} style={{ background: "#222", color: "#666", border: "1px solid #333", borderRadius: 6, padding: "10px 14px", fontFamily: "'Courier New', monospace", fontSize: 12, cursor: "pointer" }}>Close</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState("home"); // "home" | "profile" | "calendar"
  const [selectedProject, setSelectedProject] = useState(null);
  const [currentMember, setCurrentMember] = useState(null);

  const handleSelectProject = (project) => {
    setSelectedProject(project);
    setScreen("profile"); // always ask who you are — no localStorage
  };

  const handleProfileComplete = (member) => {
    setCurrentMember(member);
    setScreen("calendar");
  };

  const handleBack = () => {
    setSelectedProject(null);
    setCurrentMember(null);
    setScreen("home");
  };

  if (screen === "home") return <Homepage onSelectProject={handleSelectProject} />;
  if (screen === "profile") return <ProfileSetup project={selectedProject} onComplete={handleProfileComplete} onBack={handleBack} />;
  return <BandCalendar project={selectedProject} currentMember={currentMember} onBack={handleBack} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
