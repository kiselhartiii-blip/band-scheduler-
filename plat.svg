<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#1a1a2e"/>

  <!-- Tail -->
  <ellipse cx="390" cy="310" rx="80" ry="28" fill="#8B6914" transform="rotate(-15 390 310)"/>
  <!-- Tail flat paddle end -->
  <ellipse cx="440" cy="295" rx="48" ry="22" fill="#7A5C10" transform="rotate(-20 440 295)"/>

  <!-- Body -->
  <ellipse cx="240" cy="300" rx="130" ry="85" fill="#8B6914"/>

  <!-- Belly -->
  <ellipse cx="235" cy="315" rx="85" ry="58" fill="#C8A96E"/>

  <!-- Head -->
  <ellipse cx="140" cy="248" rx="72" ry="60" fill="#8B6914"/>

  <!-- Bill / duck bill -->
  <ellipse cx="82" cy="268" rx="52" ry="18" fill="#4A7C59" transform="rotate(8 82 268)"/>
  <!-- Bill ridge -->
  <ellipse cx="82" cy="262" rx="50" ry="8" fill="#3D6B4A" transform="rotate(8 82 262)"/>
  <!-- Nostril -->
  <ellipse cx="70" cy="260" rx="4" ry="3" fill="#2d5038"/>

  <!-- Eye -->
  <circle cx="148" cy="235" r="14" fill="#1a1a1a"/>
  <circle cx="152" cy="231" r="5" fill="white"/>
  <circle cx="154" cy="230" r="2" fill="white" opacity="0.8"/>

  <!-- Front leg -->
  <ellipse cx="175" cy="368" rx="28" ry="16" fill="#7A5C10" transform="rotate(-20 175 368)"/>
  <!-- Front paw webbing -->
  <ellipse cx="158" cy="378" rx="22" ry="10" fill="#6B4F0D" transform="rotate(-30 158 378)"/>

  <!-- Back leg -->
  <ellipse cx="310" cy="372" rx="30" ry="16" fill="#7A5C10" transform="rotate(15 310 372)"/>
  <ellipse cx="330" cy="380" rx="22" ry="10" fill="#6B4F0D" transform="rotate(10 330 380)"/>

  <!-- Crown -->
  <g transform="translate(148, 178)">
    <rect x="-38" y="-8" width="76" height="16" rx="4" fill="#FFD700"/>
    <polygon points="0,-32 -12,-8 12,-8" fill="#FFD700"/>
    <polygon points="-28,-18 -38,-8 -18,-8" fill="#FFD700"/>
    <polygon points="28,-18 38,-8 18,-8" fill="#FFD700"/>
    <circle cx="0" cy="-32" r="6" fill="#FF6B6B"/>
    <circle cx="-28" cy="-18" r="4" fill="#4ECDC4"/>
    <circle cx="28" cy="-18" r="4" fill="#A29BFE"/>
  </g>

  <!-- Fur texture lines -->
  <path d="M200 260 Q220 250 240 260" stroke="#7A5C10" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M210 278 Q235 268 258 278" stroke="#7A5C10" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M195 295 Q225 285 255 295" stroke="#7A5C10" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
